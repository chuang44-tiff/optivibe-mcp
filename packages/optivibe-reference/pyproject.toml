# pyproject.toml — minimal packaging metadata for optivibe_reference.
#
# Exists so the harness env can `pip install -e ../optivibe-reference` and import
# optivibe_reference in-process (the single OptiVibe MCP composes both tool sets;
# the harness imports the reference one-way). setuptools src-layout.
#
# Runtime `dependencies = []`: the reference glass/operand path is pure-stdlib
# (sqlite + FTS5 are stdlib), so the editable install pulls CODE only and adds zero
# dep surface to the harness env (it never competes for the single-seat license).
# The manual-PDF ingest dep (pymupdf) and the test runner (pytest) are OPTIONAL
# extras so the runtime install stays lean.
#
# package-data is an EXPLICIT list of the committed files that are ours (resolved via
# __file__-relative anchors, which an editable install preserves). Never a glob: the
# data folder also holds the files a user builds from their own licensed install, and
# none of those may enter a wheel. It also ships provenance_grants.txt, the ledger-row
# markers the two fail-closed build gates read in an installed package.
#
# `optivibe-build-data` rebuilds every vendor-derived plane from the user's own
# licensed install, with no clone. The `probe` extra adds pythonnet for
# `optivibe-build-data --probe`; the optivibe-mcp install already carries it.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optivibe-reference"
version = "0.2.0"
description = "OptiVibe reference layer: lookup tables + RAG + intent->ZOS-API grounding"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
manual = ["pymupdf"]
probe = ["pythonnet"]
dev = ["pytest"]

[project.scripts]
optivibe-build-data = "optivibe_reference.build_data:main"

[project.urls]
Homepage = "https://github.com/chuang44-tiff/optivibe-mcp"
Issues = "https://github.com/chuang44-tiff/optivibe-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optivibe_reference = [
    "data/operand_semantics.json",
    "data/operand_synonyms.json",
    "data/tolerance_operand_synonyms.json",
    "data/provenance_grants.txt",
]
