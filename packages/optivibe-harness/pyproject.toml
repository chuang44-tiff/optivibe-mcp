# pyproject.toml — packaging metadata for optivibe_harness (the ZOS-API harness MCP).
#
# Exists so `pip install -e .` makes `python -m optivibe_harness` resolve when Claude
# Code launches the single OptiVibe MCP: the reference package
# already had a pyproject; the harness did not. setuptools src-layout, mirroring
# ../optivibe-reference/pyproject.toml.
#
# Runtime `dependencies` are declared HONESTLY (they are already present in the
# `optivibe-harness` conda env, so pip sees them satisfied): pythonnet bridges the
# ZOS-API .NET surface, mcp serves the stdio MCP loop, psutil drives the PID-scoped
# process reaper, and matplotlib + numpy render the headless meridional layout figures
# (Agg backend). The reference layer `optivibe-reference` is DECLARED (one-way: the
# harness imports the reference, never the reverse), so one `pip install optivibe-mcp`
# brings both. The distribution is `optivibe-mcp`; the import packages are
# `optivibe_harness` and `optivibe_doctor`. In a clone, install the reference editable
# FIRST (`pip install -e ../optivibe-reference`), or pip fetches it from PyPI.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "optivibe-mcp"
version = "0.2.0"
description = "OptiVibe harness: ZOS-API automation, typed tools, and the single OptiVibe MCP"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pythonnet",
    # BOUNDED pin, kept in lockstep with environment.yml (the same fact, declared
    # twice).  mcp 2.0.0 removed the low-level ``Server.list_tools()`` /
    # ``.call_tool()`` decorator surface this package builds its stdio server on,
    # so an unpinned ``mcp`` resolves to a release that cannot construct the
    # server -- and it fails SILENTLY, because stdio is redirected to devnull
    # before the failing import runs, so the child exits 1 with nothing on stdout
    # or stderr.  The floor is the version the server loop is written against.
    "mcp>=1.28,<2",
    "psutil",
    # mcp is built on anyio, and ``__main__`` calls ``anyio.run`` directly.
    "anyio",
    # ``text.parse_math`` (matplotlib 3.6) draws the MTF-vs-field figure.
    "matplotlib>=3.6",
    "numpy",
    # matplotlib already requires Pillow; ``_layout_register`` imports ``PIL`` directly
    # to read the native layout raster, so the dependency is declared, not inherited.
    "pillow",
    # The reference layer, composed in-process by the single OptiVibe MCP, pinned to
    # the same release.
    "optivibe-reference==0.2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
optivibe-mcp = "optivibe_harness.__main__:main"
optivibe-doctor = "optivibe_doctor.__main__:main"

[project.urls]
Homepage = "https://github.com/chuang44-tiff/optivibe-mcp"
Issues = "https://github.com/chuang44-tiff/optivibe-mcp/issues"
Changelog = "https://github.com/chuang44-tiff/optivibe-mcp/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
