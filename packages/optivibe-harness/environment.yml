name: optivibe-harness
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Headless layout-figure channel (render_layout): matplotlib drives the Agg
  # backend for the y-z cross-section PNG; numpy is listed explicitly because the
  # sag math uses it directly (vectorized aperture sampling + radical mask). Pulled
  # from conda-forge so Windows binary wheels resolve cleanly.
  - matplotlib
  - numpy
  - pip:
      - pythonnet        # bridges Python <-> the typed .NET ZOS-API via `clr`
      - pytest           # unit + adversarial + integration test runner
      - psutil           # process introspection (server reaper, scoped to spawned PIDs)
      - mcp>=1.28,<2     # the single OptiVibe MCP stdio server (python -m optivibe_harness)
      # ^ BOUNDED pin, kept in lockstep with pyproject.toml (same fact, twice).
      # mcp 2.0.0 removed the low-level `Server.list_tools()`/`.call_tool()` decorator
      # surface this harness is built on, so an unpinned `mcp` resolves to a version
      # that cannot boot -- and fails SILENTLY (stdio is already devnull'd at that
      # point, so the child exits 1 with 0 bytes on stdout AND stderr). The floor is
      # the probe-pinned, test-gated version; see pyproject.toml for the full rationale.
      # The single OptiVibe MCP composes the reference tool set in-process: after
      # building this env, also run (from packages/optivibe-harness/):
      #     pip install -e ../optivibe-reference
      # to make `import optivibe_reference` resolve. It is pure-stdlib (no engine,
      # no added dep surface) so it never competes for the single-seat license.
      # ZOSPy is an optional convenience wrapper over the ZOS-API; add it here if
      # the harness chooses to depend on it. Direct pythonnet is the baseline.
      # - zospy
      - matplotlib>=3.6  # BOUND only: conda installs it above. ``text.parse_math``
      # (3.6+) draws render_mtf_vs_field; kept in lockstep with pyproject.toml.
