# Automated Claude review on every pull request — vendor-data-first.
#
# Complements no-vendor-data.yml (the HARD, secret-free grep fence that fails the
# build on committed vendor files) with a SEMANTIC review: Claude reads the diff
# and flags vendor-derived DATA / IP a filename grep can't catch — e.g. manual
# prose or catalog numbers pasted into a source comment — plus general correctness.
#
# Runs on your Pro/Max subscription (see claude.yml: `claude setup-token` ->
# secret CLAUDE_CODE_OAUTH_TOKEN). Default model: Fable (claude-fable-5).
#
# FORK-PR NOTE: GitHub does NOT expose repo secrets to workflows triggered by a
# pull_request from a FORK, so this Claude review runs on internal/collaborator
# PRs only. That is fine — no-vendor-data.yml needs no secret and is the hard
# guard on ALL pull requests (forks included).
#
# Validate the exact action inputs (prompt / model flag) with `/install-github-app`.
name: claude-pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription token (see claude.yml). For a pay-as-you-go key instead,
          # swap this for: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Default model for the review.
          claude_args: "--model claude-fable-5"
          prompt: |
            Review this pull request.

            TOP PRIORITY — this project ships CODE ONLY. Flag ANY vendor-derived
            data or IP introduced by the diff, and request changes if found:
              - glass catalog data (Nd/Vd/dispersion coefficient arrays, or numbers
                derived from vendor .agf files)
              - OpticStudio manual prose, or verbatim operand/tolerance descriptions
              - committed *_catalog.json / *_descriptions.json / *.db / *.agf files,
                or anything under scripts/captures/
              - vendor prose pasted into code comments or docstrings
            See PROVENANCE.md for the data policy: all vendor-derived data must be
            built locally and stays gitignored, never committed.

            Then review for correctness and clarity, and leave concise, specific
            inline comments. Be brief; do not nitpick style.
