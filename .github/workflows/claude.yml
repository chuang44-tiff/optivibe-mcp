name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # PUBLIC-REPO SAFETY — DO NOT REMOVE THE author_association CHECKS.
    # This Action runs on the repo owner's Claude subscription. Without a trust
    # check, ANY GitHub user could spend that quota by writing '@claude' in an
    # issue on this public repo. Each clause pairs the mention with the trust
    # check for THAT event's own actor, so the association cannot be satisfied
    # by a different event's context.
    #
    # NOTE: `/install-github-app` regenerates this file WITHOUT these checks (it
    # did exactly that on 2026-07-28). Re-apply them after every run of it.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    # Bound a runaway session so a single invocation cannot drain the quota.
    # 30, not 20: measured on PR #15 a focused one-area review took 14 minutes plus
    # setup and a broad one used ~18 of 20 -- a timeout kills the review before it posts.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history, so a review can diff against origin/main. With depth 1 there is
          # no base to compare to, and "read the diff" was the first thing a review tried.
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Pin the model — the regenerated template dropped this and would
          # otherwise fall back to the action's default.
          # --allowed-tools: READ-ONLY history commands, so a review can see what changed.
          # Without them the job had only Read/Grep/Glob (+ git write commands), and a
          # review on PR #15 hit 10 permission denials (the log does not name the tools;
          # its first step was "read the diff against origin/main", which it could not).
          # Nothing here can write, push or run the code under review.
          claude_args: >-
            --model claude-fable-5
            --allowed-tools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

