# Claude Code GitHub integration — the @claude bot for issues & pull requests.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS IS A STARTING TEMPLATE. After you push this repo to GitHub, run
# `/install-github-app` in Claude Code — it installs the Claude GitHub App and
# regenerates this workflow with the current action version + inputs. Prefer that
# generated file over this template if they differ.
#
# SETUP (after the repo is on GitHub; requires repo admin):
#   1. Install the Claude GitHub App on this repo (or `/install-github-app`).
#   2. Provide credentials as a repo secret (Settings → Secrets and variables → Actions):
#      * Subscription (Pro/Max): run `claude setup-token` locally, then add the
#        printed token as the secret CLAUDE_CODE_OAUTH_TOKEN (used below).
#      * OR pay-as-you-go: add an Anthropic API key as ANTHROPIC_API_KEY and swap
#        the `claude_code_oauth_token` input below for `anthropic_api_key`.
#   `/install-github-app` detects your auth and wires up the correct secret for you.
#
# PUBLIC-REPO SAFETY: this Action runs on YOUR account/credits. The `if:` guard
# below restricts the bot to repo OWNER / MEMBER / COLLABORATOR, so outside users
# cannot trigger it. Keep that guard if the repo is public.
# ─────────────────────────────────────────────────────────────────────────────
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Fire only on an explicit @claude mention AND only for trusted associations.
    if: >
      (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.review.body, '@claude') ||
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')
      ) && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR' ||
        github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription (Pro/Max) via `claude setup-token`. For a pay-as-you-go
          # API key instead, replace this line with:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Default model.
          claude_args: "--model claude-fable-5"
