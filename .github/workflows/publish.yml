name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read

# Builds both distributions from the tagged commit and uploads them to PyPI by trusted
# publishing (no stored token), optivibe-reference first because optivibe-mcp depends on it.

# Each PyPI project must name this repository, this workflow and the `pypi` environment as
# its trusted publisher.

# Uploads skip a file PyPI already has, so a run that stopped part-way can be re-run, or run
# by hand from the Actions tab.

# The check step fails the run if a wheel or a source archive carries any data file beyond the
# four the reference package ships: data a user builds from their own OpticStudio install never
# reaches PyPI.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build
        run: |
          python -m pip install build
          python -m build packages/optivibe-reference --outdir dist/reference
          python -m build packages/optivibe-harness --outdir dist/mcp
      - name: check the wheels and source archives
        run: |
          python - <<'EOF'
          import glob, sys, tarfile, zipfile
          allowed = {
              "optivibe_reference/data/operand_semantics.json",
              "optivibe_reference/data/operand_synonyms.json",
              "optivibe_reference/data/tolerance_operand_synonyms.json",
              "optivibe_reference/data/provenance_grants.txt",
          }
          wheels = glob.glob("dist/*/*.whl")
          sdists = glob.glob("dist/*/*.tar.gz")
          if len(wheels) != 2 or len(sdists) != 2:
              sys.exit("expected 2 wheels and 2 source archives, found %r" % (wheels + sdists))
          members = []
          for wheel in wheels:
              members += [(wheel, name, name) for name in zipfile.ZipFile(wheel).namelist()]
          for sdist in sdists:
              for name in tarfile.open(sdist).getnames():
                  # optivibe_reference-0.2.0/src/optivibe_reference/... -> optivibe_reference/...
                  inner = name.split("/", 1)[1] if "/" in name else ""
                  if inner.startswith("src/"):
                      inner = inner[len("src/"):]
                  members.append((sdist, name, inner))
          bad = []
          for archive, name, inner in members:
              if "/data/" in inner and ".dist-info/" not in inner and inner not in allowed:
                  bad.append((archive, name))
              if inner.endswith((".db", ".agf", ".pdf")):
                  bad.append((archive, name))
          if bad:
              sys.exit("data a wheel or source archive must not carry: %r" % bad)
          print("archives OK:", wheels + sdists)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: upload optivibe-reference
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/reference/
          skip-existing: true
      - name: upload optivibe-mcp
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/mcp/
          skip-existing: true
