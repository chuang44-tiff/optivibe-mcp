<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1180" width="600" height="1180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="ttl"><title id="ttl">The agent's loop: start from the lens, with the push group and the start yield given by the brief; set the thickness, track and nominal ceilings and keep the judge merit apart; find the sensitivity hotspots, ranked by element, group or air gap; change one lever, chosen by cause; optimize and screen the candidate (nominal under the 0.035-wave cap at every field), and if the screen fails revert and try the next lever; review the layout; run a paired per-field yield read of the candidate against its parent, then keep it, mark it not confirmed, or revert; while time and levers are left, go back to the hotspots after a keep and to the next lever otherwise; then stop and report. A separate judge scores the delivered lens outside the loop.</title><style>
.card{fill:#ffffff;stroke:#d0d7de}
.box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.3}
.key{fill:#ffffff;stroke:#57606a;stroke-width:1.6}
.out{fill:none;stroke:#8c959f;stroke-width:1.3;stroke-dasharray:5 4}
.t{fill:#1f2328;font-weight:600;font-size:15px}
.s{fill:#57606a;font-size:12.5px}
.lbl{fill:#57606a;font-size:12px}
.edge{stroke:#6e7781;stroke-width:1.5;fill:none}
.dash{stroke:#6e7781;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.loop{stroke:#0969da;stroke-width:1.5;fill:none}
.loopt{fill:#0969da;font-size:12px;font-weight:600}
.ah{fill:#6e7781}.ahl{fill:#0969da}
.rule{stroke:#d0d7de}
.keep{fill:#1a7f37}.nc{fill:#9a6700}.rev{fill:#cf222e}
.v{fill:#1f2328;font-size:12.5px}
.v2{fill:#57606a;font-size:12.5px}
@media (prefers-color-scheme: dark){
.card{fill:#0d1117;stroke:#30363d}
.box{fill:#161b22;stroke:#6e7681}
.key{fill:#0d1117;stroke:#8b949e}
.out{stroke:#6e7681}
.t{fill:#e6edf3}.s,.lbl,.v2{fill:#9198a1}
.edge,.dash{stroke:#8b949e}.ah{fill:#8b949e}
.loop{stroke:#4493f8}.loopt,.ahl{fill:#4493f8}
.rule{stroke:#30363d}
.keep{fill:#3fb950}.nc{fill:#d29922}.rev{fill:#f85149}
.v{fill:#e6edf3}
}
</style><rect class="card" x="0.5" y="0.5" width="599" height="1179" rx="12"/><rect class="box" x="128" y="24" width="330" height="60" rx="8"/><text class="t" x="293.0" y="51.0" text-anchor="middle">Start lens</text><text class="s" x="293.0" y="69.0" text-anchor="middle">the brief gives the push group and the start yield</text><path class="edge" d="M293.0,84 V104"/><polygon class="ah" points="293.0,112 287.0,103 299.0,103"/><rect class="box" x="128" y="112" width="330" height="76" rx="8"/><text class="t" x="293.0" y="139.0" text-anchor="middle">Set the ceilings first</text><text class="s" x="293.0" y="157.0" text-anchor="middle">glass thickness, track and nominal wavefront;</text><text class="s" x="293.0" y="173.0" text-anchor="middle">the judge merit is kept apart</text><path class="edge" d="M293.0,188 V208"/><polygon class="ah" points="293.0,216 287.0,207 299.0,207"/><rect class="box" x="128" y="216" width="330" height="60" rx="8"/><text class="t" x="293.0" y="243.0" text-anchor="middle">Find hotspots</text><text class="s" x="293.0" y="261.0" text-anchor="middle">sensitivity run, ranked by element / group / air gap</text><path class="edge" d="M293.0,276 V296"/><polygon class="ah" points="293.0,304 287.0,295 299.0,295"/><rect class="box" x="128" y="304" width="330" height="76" rx="8"/><text class="t" x="293.0" y="331.0" text-anchor="middle">One lever, chosen by cause</text><text class="s" x="293.0" y="349.0" text-anchor="middle">an angle-of-incidence ceiling on the hotspot,</text><text class="s" x="293.0" y="365.0" text-anchor="middle">or thickness and gap moves inside the ceilings</text><path class="edge" d="M293.0,380 V400"/><polygon class="ah" points="293.0,408 287.0,399 299.0,399"/><rect class="box" x="128" y="408" width="330" height="76" rx="8"/><text class="t" x="293.0" y="435.0" text-anchor="middle">Optimize and screen</text><text class="s" x="293.0" y="453.0" text-anchor="middle">nominal, thickness and track inside the ceilings;</text><text class="s" x="293.0" y="469.0" text-anchor="middle">sensitivity lower than a control optimize gives</text><path class="edge" d="M293.0,484 V512"/><polygon class="ah" points="293.0,520 287.0,511 299.0,511"/><text class="lbl" x="303.0" y="505">screen passes</text><path class="loop" d="M458,446.0 H480 V342.0 H466"/><polygon class="ahl" points="458,342.0 467,336.0 467,348.0"/><text class="loopt" x="489" y="391.0">screen fails:</text><text class="loopt" x="489" y="407.0">revert, next lever</text><rect class="box" x="128" y="520" width="330" height="60" rx="8"/><text class="t" x="293.0" y="547.0" text-anchor="middle">Look at the layout</text><text class="s" x="293.0" y="565.0" text-anchor="middle">a reviewer subagent; the agent answers each finding</text><path class="edge" d="M293.0,580 V600"/><polygon class="ah" points="293.0,608 287.0,599 299.0,599"/><rect class="key" x="56" y="608" width="516" height="214" rx="8"/><text class="t" x="74" y="635">Paired per-field yield read</text><text class="s" x="74" y="654">candidate against its parent, 1000 simulated builds per field, twice,</text><text class="s" x="74" y="670">refocus only; the worst field decides</text><line class="rule" x1="74" x2="554" y1="684" y2="684"/><circle class="keep" cx="80" cy="702.5" r="5"/><text class="v" x="94" y="707" font-weight="600">Keep</text><text class="v" x="198" y="707">worst field resolved better, no field resolved worse</text><text class="v2" x="198" y="723">it becomes the new parent</text><circle class="nc" cx="80" cy="742.5" r="5"/><text class="v" x="94" y="747" font-weight="600">Not confirmed</text><text class="v" x="198" y="747">anything else</text><text class="v2" x="198" y="763">may screen on from it; it is not the parent</text><circle class="rev" cx="80" cy="782.5" r="5"/><text class="v" x="94" y="787" font-weight="600">Revert</text><text class="v" x="198" y="787">a resolved loss at any field</text><text class="v2" x="198" y="803">reload the parent</text><path class="edge" d="M293.0,822 V846"/><polygon class="ah" points="293.0,854 287.0,845 299.0,845"/><polygon class="box" points="293.0,854 418.0,896.0 293.0,938 168.0,896.0" stroke-linejoin="round"/><text class="t" x="293.0" y="901.0" text-anchor="middle">Time and levers left?</text><path class="loop" d="M168.0,896.0 H26 V246.0 H120"/><polygon class="ahl" points="128,246.0 119,240.0 119,252.0"/><path class="loop" d="M26,342.0 H120"/><polygon class="ahl" points="128,342.0 119,336.0 119,348.0"/><text class="loopt" x="34" y="888.0">yes</text><text class="loopt" x="34" y="238.0">after a keep</text><text class="loopt" x="34" y="334.0">otherwise</text><path class="edge" d="M293.0,938 V962"/><polygon class="ah" points="293.0,970 287.0,961 299.0,961"/><text class="lbl" x="303.0" y="957">no</text><rect class="box" x="128" y="970" width="330" height="76" rx="8"/><text class="t" x="293.0" y="997.0" text-anchor="middle">Stop and report</text><text class="s" x="293.0" y="1015.0" text-anchor="middle">the last kept lens, every round with its decision,</text><text class="s" x="293.0" y="1031.0" text-anchor="middle">and the hotspots left untried</text><path class="dash" d="M293.0,1046 V1072"/><polygon class="ah" points="293.0,1080 287.0,1071 299.0,1071"/><rect class="out" x="128" y="1080" width="330" height="76" rx="8"/><text class="t" x="293.0" y="1107.0" text-anchor="middle">Judge, outside the agent's loop</text><text class="s" x="293.0" y="1125.0" text-anchor="middle">2000-trial Monte Carlo of the delivered lens,</text><text class="s" x="293.0" y="1141.0" text-anchor="middle">refocus plus the push</text></svg>
