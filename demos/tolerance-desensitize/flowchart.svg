<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 770" width="520" height="770" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="ttl"><title id="ttl">The agent's loop: pick the push group, find hotspots, change one lever by cause, optimize and screen, confirm with a 200-trial Monte Carlo, then keep, mark not confirmed, or revert; repeat while time and levers are left, else stop and report.</title><style>
.card{fill:#ffffff;stroke:#d0d7de}
.box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.3}
.key{fill:#ffffff;stroke:#57606a;stroke-width:1.6}
.t{fill:#1f2328;font-weight:600;font-size:15px}
.s{fill:#57606a;font-size:12.5px}
.lbl{fill:#57606a;font-size:12px}
.edge{stroke:#6e7781;stroke-width:1.5;fill:none}
.loop{stroke:#0969da;stroke-width:1.5;fill:none}
.loopt{fill:#0969da;font-size:12px;font-weight:600}
.ah{fill:#6e7781}.ahl{fill:#0969da}
.rule{stroke:#d0d7de}
.keep{fill:#1a7f37}.nc{fill:#9a6700}.rev{fill:#cf222e}
.v{fill:#1f2328;font-size:12.5px}
@media (prefers-color-scheme: dark){
.card{fill:#0d1117;stroke:#30363d}
.box{fill:#161b22;stroke:#6e7681}
.key{fill:#0d1117;stroke:#8b949e}
.t{fill:#e6edf3}.s,.lbl{fill:#9198a1}
.edge{stroke:#8b949e}.ah{fill:#8b949e}
.loop{stroke:#4493f8}.loopt,.ahl{fill:#4493f8}
.rule{stroke:#30363d}
.keep{fill:#3fb950}.nc{fill:#d29922}.rev{fill:#f85149}
.v{fill:#e6edf3}
}
</style><rect class="card" x="0.5" y="0.5" width="519" height="769" rx="12"/><rect class="box" x="40" y="24" width="300" height="76" rx="8"/><text class="t" x="190.0" y="51.0" text-anchor="middle">Pick the push group</text><text class="s" x="190.0" y="69.0" text-anchor="middle">up to 200 simulated builds per candidate,</text><text class="s" x="190.0" y="85.0" text-anchor="middle">shared time budget</text><path class="edge" d="M190.0,100 V122"/><polygon class="ah" points="190.0,130 184.0,121 196.0,121"/><rect class="box" x="40" y="130" width="300" height="62" rx="8"/><text class="t" x="190.0" y="158.0" text-anchor="middle">Find hotspots</text><text class="s" x="190.0" y="176.0" text-anchor="middle">sensitivity, ranked by element / group / air gap</text><path class="edge" d="M190.0,192 V214"/><polygon class="ah" points="190.0,222 184.0,213 196.0,213"/><rect class="box" x="40" y="222" width="300" height="44" rx="8"/><text class="t" x="190.0" y="249.0" text-anchor="middle">One lever, chosen by cause</text><path class="edge" d="M190.0,266 V292"/><polygon class="ah" points="190.0,300 184.0,291 196.0,291"/><rect class="box" x="40" y="300" width="300" height="60" rx="8"/><text class="t" x="190.0" y="327.0" text-anchor="middle">Optimize</text><text class="s" x="190.0" y="345.0" text-anchor="middle">+ cheap sensitivity screen</text><path class="edge" d="M190.0,360 V392"/><polygon class="ah" points="190.0,400 184.0,391 196.0,391"/><text class="lbl" x="200.0" y="384">screen passes</text><path class="loop" d="M340,330.0 H372 V244.0 H348"/><polygon class="ahl" points="340,244.0 349,238.0 349,250.0"/><text class="loopt" x="382" y="284.0">no gain:</text><text class="loopt" x="382" y="300.0">revert, next lever</text><rect class="key" x="40" y="400" width="440" height="150" rx="8"/><text class="t" x="58" y="427">Confirm</text><text class="s" x="58" y="446">200-trial Monte Carlo with refocus + push</text><line class="rule" x1="58" x2="462" y1="462" y2="462"/><circle class="keep" cx="64" cy="481.5" r="5"/><text class="v" x="78" y="486"><tspan font-weight="600">Keep</tspan></text><text class="v" x="182" y="486">about 10 points over the start, tail not higher</text><circle class="nc" cx="64" cy="505.5" r="5"/><text class="v" x="78" y="510"><tspan font-weight="600">Not confirmed</tspan></text><text class="v" x="182" y="510">smaller gain</text><circle class="rev" cx="64" cy="529.5" r="5"/><text class="v" x="78" y="534"><tspan font-weight="600">Revert</tspan></text><text class="v" x="182" y="534">a loss</text><path class="edge" d="M190.0,550 V576"/><polygon class="ah" points="190.0,584 184.0,575 196.0,575"/><polygon class="box" points="190.0,584 310.0,626.0 190.0,668 70.0,626.0" stroke-linejoin="round"/><text class="t" x="190.0" y="631.0" text-anchor="middle">Time and levers left?</text><path class="loop" d="M70.0,626.0 H18 V161.0 H32"/><polygon class="ahl" points="40,161.0 31,155.0 31,167.0"/><text class="loopt" x="24" y="618.0">yes</text><path class="edge" d="M190.0,668 V694"/><polygon class="ah" points="190.0,702 184.0,693 196.0,693"/><text class="lbl" x="200.0" y="688">no</text><rect class="box" x="40" y="702" width="300" height="44" rx="8"/><text class="t" x="190.0" y="729.0" text-anchor="middle">Stop and report</text></svg>
